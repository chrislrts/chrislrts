name: Refresh receipt

on:
  schedule:
    - cron: "17 18 * * *"   # 01:17 Bangkok
  workflow_dispatch:

permissions:
  contents: write

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs
      - run: node scripts/fetch-contrib.mjs
        env:
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
      - run: node scripts/receipt.mjs
      - name: Commit if changed
        run: |
          git add data/contrib.json assets/receipt-dark.svg assets/receipt-light.svg
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh receipt"
          git push
